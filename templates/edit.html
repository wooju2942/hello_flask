<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기술 수정</title>
</head>
<body>
    <h1>기술 수정</h1>

    <form action="/update/{{ skill['id'] }}" method="post">
        <input type="text" name="name" value="{{ skill['name'] }}" required>
        <input type="text" name="status" value="{{ skill['status'] }}" required>
        <button type="submit">수정 완료</button>
    </form>

    <a href="/">목록으로</a>
</body>
</html>
